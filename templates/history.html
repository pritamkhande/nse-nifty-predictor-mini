<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nifty 50 – Prediction History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
    }
    header {
      padding: 1.5rem 1.5rem 0.5rem;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .sub {
      font-size: 0.9rem;
      color: #9ca3af;
    }
    main {
      padding: 1.5rem;
      max-width: 1024px;
      margin: 0 auto 2rem;
    }
    a.back-link {
      font-size: 0.85rem;
      color: #a855f7;
      text-decoration: none;
    }
    .card {
      background: radial-gradient(circle at top left, #1f2937, #020617);
      border-radius: 1rem;
      padding: 1.25rem;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.8);
      margin-top: 1rem;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    th, td {
      padding: 0.5rem 0.4rem;
      text-align: left;
    }
    th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      border-bottom: 1px solid rgba(75, 85, 99, 0.7);
    }
    tr:nth-child(even) td {
      background: rgba(15, 23, 42, 0.6);
    }
    tr:nth-child(odd) td {
      background: rgba(2, 6, 23, 0.8);
    }
    td {
      border-bottom: 1px solid rgba(15, 23, 42, 0.9);
    }
    .pill-up {
      color: #22c55e;
      font-weight: 600;
    }
    .pill-down {
      color: #f97373;
      font-weight: 600;
    }
    footer {
      padding: 0 1.5rem 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Nifty 50 – Prediction History</div>
    <div class="sub">
      All recorded AI directional signals for the Nifty 50 index.
    </div>
  </header>

  <main>
    <a href="index.html" class="back-link">← Back to dashboard</a>

    <section class="card">
      <div class="card-title">Signal Log</div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Generated (UTC)</th>
            <th>Last Data Date</th>
            <th>Predicted For</th>
            <th>Label</th>
            <th>Prob UP</th>
            <th>Prob DOWN</th>
          </tr>
        </thead>
        <tbody>
          {{HISTORY_ROWS}}
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    This page is automatically generated from model outputs.
  </footer>
</body>
</html>
